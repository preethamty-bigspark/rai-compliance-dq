[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
rai_compliance = ["*.yaml", "*.json"]

[project]
name = "rai-compliance"
version = "0.1.0"
description = "A framework for responsible AI governance and testing"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Eric Gbekor", email = "eric.gbekor@bigspark.dev"},
    {name = "Liam Kristoffy", email = "liam.kristoffy@bigspark.dev"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "pydantic>=1.9.0,<2.0.0", # Specify <2.0.0 for compatibility
    "jsonschema>=4.0.0",
    "importlib-metadata>=4.0.0; python_version < '3.10'", # Only needed for Python <3.10
    "reportlab>=3.6.0",
    "typing-extensions>=4.0.0", # For Protocol and other type hints in older Python
    "packaging>=21.0", # For version parsing and comparison
    "polars>=1.8.2",
    "matplotlib>=3.7.5",
    "pillow>=10.4.0",
    "markdown>=3.7",
    "aif360>=0.6.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
    "black>=23.0.0",
    "isort>=5.9.1",
    "flake8>=3.9.2",
    "mypy>=1.0.0",
    "pylint>=2.12.0",
]
torch = [
    "torch>=1.10.0",
]
tensorflow = [
    "tensorflow>=2.8.0",
]
nlp = [
    "transformers>=4.0.0",
]
html = [
    "markdown>=3.3.0",
]
pii = [
    "presidio-analyzer>=2.2.0",
    "spacy>=3.0.0",
]
all = [
    "torch>=1.10.0",
    "tensorflow>=2.8.0",
    "transformers>=4.0.0",
    "markdown>=3.3.0",
    "presidio-analyzer>=2.2.0",
    "spacy>=3.0.0",
]

[project.scripts]
rai-compliance = "rai_compliance.cli:main"

[project.entry-points."rai_compliance.metrics"]
# Core metrics are registered automatically through Python's import system
data_quality_metrics = "rai_compliance.metrics.data_quality"
fairness_metrics = "rai_compliance.metrics.fairness"
privacy_metrics = "rai_compliance.metrics.privacy"
performance_metrics = "rai_compliance.metrics.performance"

# Define the entry point group for connectors
# External packages can register connectors here
[project.entry-points."rai_compliance.connectors"]
# No default connectors in the core package
# Example: aif360_connector = "rai_compliance_aif360.connector:AIF360Connector"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "rai_compliance.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
